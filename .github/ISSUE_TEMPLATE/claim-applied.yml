name: Claim a Applied research meeting slot
description: Sign up to present or lead a Applied research meeting
title: "Applied research meeting claim"
labels: [claim-applied]
body:
  - type: dropdown
    id: week
    attributes:
      label: Date
      description: Pick the meeting date you want
      options:
        - "09/22"
        - "10/06"
        - "10/20"
        - "11/03"
        - "11/17"
        - "12/01"
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Your name
      description: As it should appear on the sign-up sheet
    validations:
      required: true
